<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laporan Nilai Mahasiswa</title>
  <link href="style.css" rel="stylesheet">
</head>

<body>

  <div class="card">
    <h1 id="header-title">Laporan Studi</h1>

    <div class="mb-4">
      <label for="input-nama">Nama: </label>
      <input type="text" id="input-nama" placeholder="Masukan Nama">
    </div>

    <div class="mb-4">
      <label for="input-nilai">Nilai:</label>
      <input type="number" id="input-nilai" placeholder="Masukan Nilai">
    </div>

    <button id="submit-btn">Submit</button>

    <hr>

    <p>Nama: <span id="nama-mhs">-</span></p>
    <p>Nilai: <span id="nilai-mhs">-</span></p>
    <p id="status-kelulusan">Status: Sedang diproses...</p>
  </div>

  <script src="soal1.js">

  </script>
</body>

</html>
