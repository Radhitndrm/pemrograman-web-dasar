<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Cuaca</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="card">
    <div class="search">
      <input type="text" placeholder="Masukkan Nama Kota">
      <button><img src="images/search.png" alt="Search"></button>
    </div>
    <div class="weather">
      <img src="images/clear.png" class="weather-icon" alt="Weather Icon">
      <h1 class="tempt">--°C</h1>
      <h2 class="city">Kota</h2>
      <div class="details">
        <div class="col">
          <img src="images/humidity.png" alt="">
          <div>
            <p class="humidity">--%</p>
            <p>Kelembapan</p>
          </div>
        </div>
        <div class="col">
          <img src="images/wind.png" alt="">
          <div>
            <p class="wind">-- km/h</p>
            <p>Kecepatan Angin</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
